<!doctype html>
<html lang="fr">
  <head>
<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulaire de contact bien etre en combrailles</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
     <header> 
      <a href="Bien etre en combrailles.html" style="text-decoration: none;">
      <img
        src="images/baniere.jpg"
        class="baniere-top"
        alt="baniere de Nathalie Rambert"
      />
    </a>
    </header>
    <div class="form-container">
      <h1>Formulaire de Contact</h1>
      <p class="subtitle-form-h1">(Reponse sous 48h)</p>
      <form id="contactForm"
      action="https://formspree.io/f/xgaweeee"
      method="POST">
        <div class="form-group">
          <label for="prenom">Prénom *</label>
          <input
            type="text"
            id="prenom"
            name="prenom"
            required
            placeholder="Entrez votre prénom"
          />
        </div>

        <div class="form-group">
          <label for="nom">Nom *</label>
          <input
            type="text"
            id="nom"
            name="nom"
            required
            placeholder="Entrez votre nom"
          />
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="Entrez votre email"
          />
        </div>

        <div class="form-group">
          <label for="telephone">Téléphone</label>
          <input
            type="tel"
            id="telephone"
            name="telephone"
            placeholder="Entrez votre téléphone"
          />
        </div>

        <div class="form-group">
          <label for="sujet">Sujet *</label>
          <input
            type="text"
            id="sujet"
            name="sujet"
            required
            placeholder="Sujet de votre message"
          />
        </div>

        <div class="form-group">
          <label for="message">Message *</label>
          <textarea
            id="message"
            name="message"
            required
            placeholder="Entrez votre message"
          ></textarea>
        </div>

        <div class="button-group">
          <button type="submit" class="btn-submit">Envoyer</button>
          <button type="reset" class="btn-reset">Réinitialiser</button>
        </div>
      </form>

      <div id="responseMessage" class="message"></div>
    </div>

   
  </body>
</html>
