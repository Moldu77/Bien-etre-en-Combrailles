<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact / Devis - Bien-être en Combrailles</title>
    <meta name="description" content="Formulaire de contact pour demandes de devis et informations - Bien-être en Combrailles" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <img src="images/baniere.jpg" class="baniere-top" alt="baniere de Nathalie Rambert" />
      <div class="site-header">
        <button id="nav-toggle" aria-expanded="false" aria-controls="navbar" class="nav-toggle" aria-label="Ouvrir le menu">
          <span class="hamburger"></span>
        </button>
        <nav id="navbar" class="nav-links" role="navigation">
          <a href="Bien etre en combrailles.html">ACCUEIL</a>
        </nav>
      </div>
      <h1 style="margin:8px;">CONTACT & DEVIS</h1>
    </header>

    <main>
      <section id="contact-form">
        <div class="form-container">
          <h1>Contact & Devis</h1>
          <p class="subtitle-form-h1">Réponse sous 48h</p>

          <form id="contactForm" novalidate action="https://formspree.io/f/xaewpaww"
            method="POST">
            
            <div class="form-group">
              <label for="prenom">Prénom *</label>
              <input type="text" id="prenom" name="prenom" required placeholder="Entrez votre prénom" />
            </div>

            <div class="form-group">
              <label for="nom">Nom *</label>
              <input type="text" id="nom" name="nom" required placeholder="Entrez votre nom" />
            </div>

            <div class="form-group">
              <label for="email">Email *</label>
              <input type="email" id="email" name="email" required placeholder="Entrez votre email" />
            </div>

            <div class="form-group">
              <label for="telephone">Téléphone</label>
              <input type="tel" id="telephone" name="telephone" placeholder="Entrez votre téléphone" />
            </div>

            <div class="form-group">
              <label for="sujet">Sujet *</label>
              <input type="text" id="sujet" name="sujet" required placeholder="Sujet de votre message" />
            </div>

            <div class="form-group">
              <label for="message">Message *</label>
              <textarea id="message" name="message" required placeholder="Entrez votre message"></textarea>
            </div>

            <div class="button-group">
              <button type="submit" class="btn btn-submit">Envoyer</button>
              <button type="reset" class="btn btn-reset">Réinitialiser</button>
            </div>
          </form>

          <div id="responseMessage" class="message" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-inner">
        <div class="footer-left">
          <h4>Bien-être en Combrailles</h4>
          <p>Service d'accompagnement et d'aide à domicile dans les Combrailles.</p>
        </div>
        <div class="footer-center">
          <h5>Navigation</h5>
          <nav class="footer-legal">
            <a href="mentions-legales.html" class="legal-link">Mentions légales</a>
            <a href="rgpd.html" class="legal-link">RGPD</a>
            <a href="cgv.html" class="legal-link">CGV</a>
            <a href="confidentialite.html" class="legal-link">Confidentialité</a>
          </nav>
        </div>
        <div class="footer-right">
          <p class="small">&copy; <span id="year"></span> Bien-être en Combrailles</p>
        </div>
      </div>
    </footer>
<script>
  (function(){
    const form = document.getElementById('contactForm');
    const response = document.getElementById('responseMessage');

    // Fill current year in footer
    const yearEl = document.getElementById('year');
    if (yearEl) yearEl.textContent = new Date().getFullYear();

    if (form) {
      form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(form);

        try {
          const responseForm = await fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: { 'Accept': 'application/json' }
          });

          if (responseForm.ok) {
            response.className = 'message success';
            response.textContent = 'Merci — votre message a bien été envoyé.';
            form.reset();
          } else {
            response.className = 'message error';
            response.textContent = 'Une erreur est survenue. Veuillez réessayer.';
          }
        } catch (err) {
          response.className = 'message error';
          response.textContent = 'Erreur réseau. Vérifiez votre connexion et réessayez.';
        }
      });
    }
  })();
</script>
  </body>
</html>
